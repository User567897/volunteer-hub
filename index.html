<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Volunteer Hub">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <title>Avenger Volunteer Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #fff;
    }

    @supports not (height: 100dvh) {
      #appFrame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    title="Avenger Volunteer Hub"
    allow="camera; clipboard-write">
  </iframe>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyyCQXQLKFYQ6L7yYAyqZZnW3cYQ3py_dNo0EOTW-cktzPopdZYrojnpbJ0IWiKa-1zFg/exec";
    const AUTH_KEY = "avenger_vh_auth_token";
    const frame = document.getElementById("appFrame");

    function launch() {
      const savedToken = localStorage.getItem(AUTH_KEY) || "";
      const url = new URL(BACKEND_URL);

      if (savedToken) {
        url.searchParams.set("vh_token", savedToken);
      }

      // Prevent the installed PWA from reopening a stale Apps Script page.
      url.searchParams.set("_vh", Date.now().toString());

      frame.src = url.toString();
    }

    window.addEventListener("message", (event) => {
      const msg = event.data || {};

      if (msg.channel !== "avenger-volunteer-hub") return;

      if (
        msg.type === "VH_AUTH_TOKEN" &&
        typeof msg.token === "string" &&
        msg.token
      ) {
        localStorage.setItem(AUTH_KEY, msg.token);
      }

      if (msg.type === "VH_LOGOUT") {
        localStorage.removeItem(AUTH_KEY);
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
          const reg = await navigator.serviceWorker.ready;
          reg.update();
        } catch (e) {}
      });
    }

    launch();
  </script>
</body>
</html>
